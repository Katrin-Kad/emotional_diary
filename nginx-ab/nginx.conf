# Случайное назначение для новых посетителей (по ID запроса)
split_clients "$request_id" $ab_new {
    50% "a";
    50% "b";
}

# Используем cookie если уже есть, иначе — случайное назначение
map $cookie_ab $ab_variant {
    "a"     "a";
    "b"     "b";
    default $ab_new;
}

server {
    listen 80;

    resolver 127.0.0.11 valid=30s;

    # Устанавливаем sticky cookie на 30 дней
    add_header Set-Cookie "ab=$ab_variant; Max-Age=2592000; Path=/; SameSite=Lax" always;

    # API → node-api (перехватываем до фронтенда)
    location ~ ^/(auth|entries|tags|analyze-emotion|recommendation|ui-reaction|stats|strategies|api-docs) {
        proxy_pass http://node-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-AB-Variant $ab_variant;
    }

    # Всё остальное → нужный вариант фронтенда
    location / {
        proxy_pass http://frontend-$ab_variant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

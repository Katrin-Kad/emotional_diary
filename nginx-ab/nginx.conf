split_clients "$request_id" $ab_new {
    50% "a";
    50% "b";
}

map $cookie_ab $ab_variant {
    "a"     "a";
    "b"     "b";
    default $ab_new;
}

upstream frontend_a {
    server frontend-a:80;
}

upstream frontend_b {
    server frontend-b:80;
}

map $ab_variant $fe_upstream {
    "a"     "frontend_a";
    "b"     "frontend_b";
    default "frontend_a";
}

server {
    listen 80;

    location ~ ^/(auth|entries|tags|analyze-emotion|recommendation|ui-reaction|stats|strategies|api-docs) {
        proxy_pass http://node-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-AB-Variant $ab_variant;
    }

    location / {
        proxy_pass http://$fe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Set-Cookie "ab=$ab_variant; Max-Age=31536000; Path=/; SameSite=Lax" always;
    }
}

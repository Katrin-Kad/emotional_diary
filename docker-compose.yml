services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes:
      - neo4jdata:/data
    expose:
      - "7687"
    ports:
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  nlp-service:
    build: ./nlp-service
    environment:
      HF_TOKEN: ${HF_TOKEN}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s

  node-api:
    build: ./node-api
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NLP_SERVICE_URL: http://nlp-service:8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      COOKIE_SECURE: "false"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nlp-service:
        condition: service_healthy

  frontend-a:
    build:
      context: ./frontend
      args:
        VARIANT: a
    expose:
      - "80"

  frontend-b:
    build:
      context: ./frontend
      args:
        VARIANT: b
    expose:
      - "80"

  router:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-ab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-a
      - frontend-b
      - node-api

volumes:
  pgdata:
  neo4jdata:
